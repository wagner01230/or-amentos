<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa da Elétrica – Gerador de Orçamentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============================================================
   RESET E VARIÁVEIS
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --azul:#0a4d9c;
  --azul-esc:#073a75;
  --azul-claro:#e8f0fb;
  --amarelo:#ffc107;
  --amarelo-esc:#e0a800;
  --cinza:#f4f6f9;
  --cinza-borda:#dfe4ec;
  --texto:#1e293b;
  --texto-claro:#64748b;
  --perigo:#dc2626;
  --sucesso:#16a34a;
  --aviso:#f59e0b;
  --sombra:0 2px 8px rgba(10,77,156,.08);
  --sombra-forte:0 4px 20px rgba(10,77,156,.15);
  --radius:12px;
  --topbar:60px;
  --sidebar:240px;
}
html,body{height:100%;}
body{
  font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cinza);
  color:var(--texto);
  font-size:15px;
  line-height:1.5;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:15px;}
a{color:var(--azul);text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

/* ============================================================
   LAYOUT PRINCIPAL
   ============================================================ */
#app{display:flex;min-height:100vh;}

/* Sidebar (desktop) */
#sidebar{
  width:var(--sidebar);
  background:linear-gradient(180deg,var(--azul) 0%,var(--azul-esc) 100%);
  color:#fff;
  position:fixed;
  top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:200;
  transition:transform .25s ease;
  box-shadow:var(--sombra-forte);
}
#sidebar .brand{
  padding:18px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;gap:10px;
}
#sidebar .brand .brand-icon{
  width:42px;height:42px;border-radius:10px;
  background:var(--amarelo);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--azul-esc);font-weight:bold;
  flex-shrink:0;
}
#sidebar .brand .brand-text{line-height:1.15;}
#sidebar .brand .brand-text strong{display:block;font-size:15px;}
#sidebar .brand .brand-text small{font-size:11px;opacity:.75;}
#sidebar nav{flex:1;padding:12px 8px;overflow-y:auto;}
#sidebar nav a{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;margin-bottom:3px;
  border-radius:9px;color:rgba(255,255,255,.85);
  font-size:14px;font-weight:500;
  transition:all .15s;
}
#sidebar nav a .ico{font-size:18px;width:22px;text-align:center;}
#sidebar nav a:hover{background:rgba(255,255,255,.1);color:#fff;}
#sidebar nav a.active{
  background:var(--amarelo);color:var(--azul-esc);font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
#sidebar .sidebar-footer{
  padding:12px 16px;font-size:11px;opacity:.7;
  border-top:1px solid rgba(255,255,255,.12);
}

/* Main */
#main{
  flex:1;
  margin-left:var(--sidebar);
  min-width:0;
  display:flex;flex-direction:column;
}
#topbar{
  height:var(--topbar);
  background:#fff;
  border-bottom:1px solid var(--cinza-borda);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  position:sticky;top:0;z-index:100;
  box-shadow:var(--sombra);
}
#topbar .topbar-title{font-weight:700;font-size:17px;color:var(--azul);display:flex;align-items:center;gap:10px;}
#topbar .topbar-actions{display:flex;gap:10px;align-items:center;}
#menuToggle{display:none;font-size:24px;color:var(--azul);padding:6px 10px;border-radius:8px;}
#menuToggle:hover{background:var(--azul-claro);}

#content{
  padding:22px;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  flex:1;
}

/* ============================================================
   COMPONENTES GERAIS
   ============================================================ */
.card{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--sombra);
  padding:20px;margin-bottom:18px;
  border:1px solid var(--cinza-borda);
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.card-header h2,.card-header h3{
  font-size:17px;color:var(--azul);display:flex;align-items:center;gap:8px;
}
.page-title{font-size:24px;color:var(--azul);margin-bottom:18px;display:flex;align-items:center;gap:10px;font-weight:800;}
.page-title .sub{font-size:13px;color:var(--texto-claro);font-weight:400;margin-top:2px;display:block;}

/* Botões */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:9px;font-size:14px;font-weight:600;
  transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--azul);color:#fff;}
.btn-primary:hover{background:var(--azul-esc);box-shadow:var(--sombra-forte);transform:translateY(-1px);}
.btn-amarelo{background:var(--amarelo);color:var(--azul-esc);}
.btn-amarelo:hover{background:var(--amarelo-esc);transform:translateY(-1px);}
.btn-outline{background:#fff;color:var(--azul);border:1.5px solid var(--azul);}
.btn-outline:hover{background:var(--azul-claro);}
.btn-danger{background:var(--perigo);color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-success{background:var(--sucesso);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-ghost{background:transparent;color:var(--texto-claro);padding:8px 12px;}
.btn-ghost:hover{background:var(--cinza);color:var(--texto);}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* Formulários */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--texto);margin-bottom:6px;}
.form-group label .req{color:var(--perigo);}
.form-control{
  width:100%;padding:10px 12px;
  border:1.5px solid var(--cinza-borda);border-radius:8px;
  font-size:14px;transition:border .15s;background:#fff;
}
.form-control:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(10,77,156,.1);}
textarea.form-control{resize:vertical;min-height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:700px){.form-row,.form-row-3{grid-template-columns:1fr;}}

/* Busca */
.search-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.search-bar .search-input{flex:1;min-width:180px;position:relative;}
.search-bar .search-input input{padding-left:36px;}
.search-bar .search-input .search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--texto-claro);}

/* Tabelas */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--cinza-borda);}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px;}
table th{
  background:var(--azul-claro);color:var(--azul);
  text-align:left;padding:11px 14px;font-weight:700;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
}
table td{padding:11px 14px;border-top:1px solid var(--cinza-borda);vertical-align:middle;}
table tbody tr:hover{background:#fafcff;}
table .actions-cell{display:flex;gap:6px;flex-wrap:wrap;}
.icon-btn{
  width:32px;height:32px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;
}
.icon-btn.edit{background:var(--azul-claro);color:var(--azul);}
.icon-btn.edit:hover{background:var(--azul);color:#fff;}
.icon-btn.del{background:#fee2e2;color:var(--perigo);}
.icon-btn.del:hover{background:var(--perigo);color:#fff;}
.icon-btn.view{background:#dcfce7;color:var(--sucesso);}
.icon-btn.view:hover{background:var(--sucesso);color:#fff;}

/* Badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.badge.aberto{background:#dbeafe;color:#1e40af;}
.badge.enviado{background:#fef3c7;color:#92400e;}
.badge.aprovado{background:#dcfce7;color:#166534;}
.badge.recusado{background:#fee2e2;color:#991b1b;}
.badge.vencido{background:#e5e7eb;color:#374151;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:16px;
  border:1px solid var(--cinza-borda);box-shadow:var(--sombra);
  position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul);}
.stat-card.amarelo::before{background:var(--amarelo);}
.stat-card.verde::before{background:var(--sucesso);}
.stat-card.vermelho::before{background:var(--perigo);}
.stat-card .stat-label{font-size:12px;color:var(--texto-claro);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.stat-card .stat-value{font-size:26px;font-weight:800;color:var(--azul);line-height:1.1;}
.stat-card .stat-sub{font-size:12px;color:var(--texto-claro);margin-top:4px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:none;align-items:center;justify-content:center;
  z-index:1000;padding:20px;backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:16px;max-width:640px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:none;}}
.modal-header{
  padding:18px 22px;border-bottom:1px solid var(--cinza-borda);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;border-radius:16px 16px 0 0;
}
.modal-header h3{color:var(--azul);font-size:18px;}
.modal-close{font-size:24px;color:var(--texto-claro);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--cinza);color:var(--perigo);}
.modal-body{padding:22px;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--cinza-borda);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* Toast */
#toastContainer{position:fixed;top:76px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{
  padding:13px 20px;border-radius:10px;background:#fff;color:var(--texto);
  box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:10px;border-left:4px solid var(--azul);
  animation:toastIn .25s ease;max-width:360px;
}
.toast.success{border-left-color:var(--sucesso);}
.toast.error{border-left-color:var(--perigo);}
.toast.warn{border-left-color:var(--aviso);}
@keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--texto-claro);}
.empty-state .empty-ico{font-size:48px;margin-bottom:12px;opacity:.4;}
.empty-state p{margin-bottom:16px;}

/* Utilitários */
.hidden{display:none !important;}
.text-right{text-align:right;}
.text-center{text-align:center;}
.mt-10{margin-top:10px;}
.mt-16{margin-top:16px;}
.mb-10{margin-bottom:10px;}
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.gap-10{gap:10px;}
.w-100{width:100%;}
.muted{color:var(--texto-claro);font-size:13px;}
.small{font-size:12.5px;}

/* ============================================================
   MENU MOBILE (BOTTOM BAR)
   ============================================================ */
#mobileNav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--cinza-borda);
  z-index:150;box-shadow:0 -2px 12px rgba(0,0,0,.08);
}
#mobileNav .mnav{display:flex;justify-content:space-around;}
#mobileNav .mnav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;color:var(--texto-claro);font-size:10.5px;font-weight:600;
  text-align:center;
}
#mobileNav .mnav a .ico{font-size:20px;}
#mobileNav .mnav a.active{color:var(--azul);}
#mobileNav .mnav a.active .ico{transform:translateY(-2px);}

/* ============================================================
   ORÇAMENTO / DOCUMENTO
   ============================================================ */
.orc-produto-row{
  background:var(--cinza);border:1px solid var(--cinza-borda);
  border-radius:10px;padding:12px;margin-bottom:10px;
}
.orc-produto-row .prod-line{display:grid;grid-template-columns:2fr .6fr .8fr .9fr .9fr auto;gap:10px;align-items:end;}
@media(max-width:900px){.orc-produto-row .prod-line{grid-template-columns:1fr 1fr;}}
.orc-produto-row .prod-line .form-group{margin-bottom:0;}
.orc-produto-row .prod-obs{margin-top:8px;}
.orc-produto-row .prod-total{font-weight:800;color:var(--azul);font-size:16px;padding-bottom:10px;white-space:nowrap;}
@media(max-width:900px){.orc-produto-row .prod-total{text-align:right;padding:0;}}

.totais-box{background:var(--azul-claro);border-radius:12px;padding:18px;border:1px solid #c9ddf5;}
.totais-box .linha{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
.totais-box .linha.total{
  border-top:2px solid var(--azul);margin-top:8px;padding-top:12px;
  font-size:20px;font-weight:800;color:var(--azul);
}

/* Pré-visualização / documento */
#previewArea{
  background:#e2e8f0;padding:20px;border-radius:12px;overflow-x:auto;
  display:flex;justify-content:center;
}
.doc{
  background:#fff;width:100%;max-width:820px;
  box-shadow:0 4px 24px rgba(0,0,0,.15);
  color:#1e293b;font-size:13px;line-height:1.45;
  padding:0;overflow:hidden;
}
.doc *{box-sizing:border-box;}

/* Modelo tradicional */
.doc.trad{font-family:'Segoe UI',Arial,sans-serif;border:1px solid #999;padding:26px 30px;}
.doc.trad .t-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
.doc.trad .t-brand{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.doc.trad .t-brand small{display:block;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;margin-top:3px;color:#444;}
.doc.trad .t-doc-title{text-align:right;font-size:15px;font-weight:700;text-transform:uppercase;}
.doc.trad .t-doc-title .num{font-size:18px;}
.doc.trad .t-doc-title small{display:block;font-size:11px;font-weight:400;text-transform:none;color:#444;margin-top:3px;}
.doc.trad .t-info{display:flex;gap:20px;flex-wrap:wrap;border:1px solid #999;border-radius:4px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;}
.doc.trad .t-info .ti{flex:1;min-width:180px;}
.doc.trad .t-info .ti b{display:block;font-size:10.5px;text-transform:uppercase;color:#666;letter-spacing:.5px;margin-bottom:2px;}
.doc.trad table{width:100%;border-collapse:collapse;font-size:12.5px;}
.doc.trad table th{background:#f0f0f0;color:#000;border:1px solid #999;padding:6px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;text-align:left;}
.doc.trad table td{border:1px solid #bbb;padding:6px 8px;vertical-align:top;}
.doc.trad table td.num,.doc.trad table th.num{text-align:right;}
.doc.trad .obs-item{font-size:11px;color:#555;margin-top:3px;font-style:italic;white-space:pre-wrap;}
.doc.trad .t-totais{margin-left:auto;width:280px;margin-top:12px;border:1px solid #999;border-radius:4px;padding:10px 14px;}
.doc.trad .t-totais .linha{display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px;}
.doc.trad .t-totais .linha.total{border-top:2px solid #000;margin-top:5px;padding-top:7px;font-size:16px;font-weight:800;}
.doc.trad .t-rodape{margin-top:18px;padding-top:12px;border-top:1px dashed #999;font-size:11.5px;color:#333;white-space:pre-wrap;text-align:center;}
.doc.trad .t-validade{font-size:11px;color:#444;margin-top:8px;text-align:center;}

/* Modelo moderno */
.doc.mod{font-family:'Segoe UI',Arial,sans-serif;}
.doc.mod .m-head{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-esc) 100%);color:#fff;padding:24px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.doc.mod .m-head .m-brand{display:flex;align-items:center;gap:14px;}
.doc.mod .m-head .m-logo{width:60px;height:60px;border-radius:12px;background:var(--amarelo);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--azul-esc);font-weight:900;flex-shrink:0;overflow:hidden;}
.doc.mod .m-head .m-logo img{width:100%;height:100%;object-fit:cover;}
.doc.mod .m-head .m-brand-txt strong{font-size:20px;display:block;line-height:1.1;}
.doc.mod .m-head .m-brand-txt small{font-size:11.5px;opacity:.85;display:block;margin-top:2px;}
.doc.mod .m-head .m-doc{text-align:right;}
.doc.mod .m-head .m-doc .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85;}
.doc.mod .m-head .m-doc .num{font-size:24px;font-weight:800;}
.doc.mod .m-body{padding:24px 30px;}
.doc.mod .m-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.doc.mod .m-info{background:#f4f7fc;border-radius:10px;padding:12px 14px;border:1px solid #dde7f4;}
.doc.mod .m-info b{display:block;font-size:10.5px;text-transform:uppercase;color:var(--azul);letter-spacing:.6px;margin-bottom:3px;font-weight:800;}
.doc.mod .m-info span{font-size:13px;color:#1e293b;}
.doc.mod table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
.doc.mod table th{background:var(--azul);color:#fff;padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;}
.doc.mod table th.num{text-align:right;}
.doc.mod table td{padding:9px 10px;border-bottom:1px solid #e5eaf2;vertical-align:top;}
.doc.mod table td.num{text-align:right;white-space:nowrap;}
.doc.mod table tr:nth-child(even) td{background:#fafcff;}
.doc.mod .obs-item{font-size:11px;color:#64748b;margin-top:3px;white-space:pre-wrap;}
.doc.mod .m-totais{margin-left:auto;width:300px;margin-top:16px;}
.doc.mod .m-totais .linha{display:flex;justify-content:space-between;padding:5px 12px;font-size:13px;}
.doc.mod .m-totais .linha.total{background:var(--amarelo);color:var(--azul-esc);border-radius:8px;margin-top:6px;padding:12px;font-size:18px;font-weight:900;}
.doc.mod .m-rodape{background:#0a4d9c;color:#fff;padding:18px 30px;font-size:11.5px;text-align:center;white-space:pre-wrap;margin-top:20px;}
.doc.mod .m-validade{font-size:11px;color:#64748b;text-align:center;padding:8px;}

/* ============================================================
   RESPONSIVO
   ============================================================ */
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding-bottom:64px;}
  #menuToggle{display:flex;}
  #mobileNav{display:block;}
  #content{padding:14px;}
  .page-title{font-size:20px;}
  .stat-card .stat-value{font-size:22px;}
  #topbar{padding:0 14px;}
  #topbar .topbar-title{font-size:15px;}
}
@media(max-width:600px){
  .card{padding:14px;}
  .btn{padding:9px 14px;font-size:13.5px;}
  .modal-body{padding:16px;}
  .doc{padding:0;font-size:12px;}
  .doc.trad{padding:16px;}
  .doc.mod .m-head{padding:16px;}
  .doc.mod .m-body{padding:16px;}
  .doc.mod .m-info-grid{grid-template-columns:1fr;}
  .doc.trad .t-totais,.doc.mod .m-totais{width:100%;}
}
</style>
</head>
<body>
<div id="app">

<script>
/* ============================================================
   CASA DA ELÉTRICA – GERADOR DE ORÇAMENTOS
   Sistema completo em arquivo único
   ============================================================ */

'use strict';

/* ============================================================
   1. CONSTANTES E ESTADO
   ============================================================ */
const DB_NAME = 'CasaEletricaDB';
const DB_VERSION = 1;
const STORES = ['produtos','clientes','orcamentos','config','meta'];
const BACKUP_VERSION = 1;

let db = null;
let state = {
  route: 'painel',
  produtos: [],
  clientes: [],
  orcamentos: [],
  config: {},
  orcamentoEmEdicao: null, // objeto completo em edição
  produtosTemp: [],        // linhas do orçamento em edição
  filtros: {}
};

const UNIDADES = ['UN','M','KG','PC','RL','CX','L','PAR','OUTROS'];

const CONDICOES_PAGAMENTO = [
  'À vista',
  'Dinheiro',
  'PIX',
  'Cartão de débito',
  'Cartão de crédito',
  'Boleto 30 dias',
  '30/60 dias',
  '30/60/90 dias',
  'Outro'
];

/* ============================================================
   2. UTILITÁRIOS GERAIS
   ============================================================ */
function uid(prefix='id'){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function fmtMoney(v){
  v = Number(v) || 0;
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtNum(v,dec=2){
  v = Number(v) || 0;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR');
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function addDaysISO(iso, days){
  const d = iso ? new Date(iso+'T12:00:00') : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${{info:'ℹ️',success:'✅',error:'⚠️',warn:'⏳'}[type]||'ℹ️'}</span><span>${escapeHtml(msg)}</span>`;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(40px)'; setTimeout(()=>t.remove(),300); }, 3200);
}
function confirmar(msg, titulo='Confirmação'){
  return new Promise(resolve=>{
    openModal(titulo, `<p>${escapeHtml(msg)}</p>`, [
      {label:'Cancelar', cls:'btn-outline', action:()=>{closeModal(); resolve(false);}},
      {label:'Confirmar', cls:'btn-danger', action:()=>{closeModal(); resolve(true);}}
    ]);
  });
}

/* ============================================================
   3. INDEXEDDB – INICIALIZAÇÃO E TRANSAÇÕES
   ============================================================ */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const database = e.target.result;
      if(!database.objectStoreNames.contains('produtos')){
        const s = database.createObjectStore('produtos',{keyPath:'id'});
        s.createIndex('nome','nome',{unique:false});
        s.createIndex('codigo','codigo',{unique:false});
        s.createIndex('categoria','categoria',{unique:false});
      }
      if(!database.objectStoreNames.contains('clientes')){
        const s = database.createObjectStore('clientes',{keyPath:'id'});
        s.createIndex('nome','nome',{unique:false});
      }
      if(!database.objectStoreNames.contains('orcamentos')){
        const s = database.createObjectStore('orcamentos',{keyPath:'id'});
        s.createIndex('numero','numero',{unique:true});
        s.createIndex('clienteId','clienteId',{unique:false});
        s.createIndex('situacao','situacao',{unique:false});
        s.createIndex('data','data',{unique:false});
      }
      if(!database.objectStoreNames.contains('config')){
        database.createObjectStore('config',{keyPath:'chave'});
      }
      if(!database.objectStoreNames.contains('meta')){
        database.createObjectStore('meta',{keyPath:'chave'});
      }
    };
    req.onsuccess = e=>{ db = e.target.result; resolve(db); };
    req.onerror = e=>reject(e.target.error);
  });
}
function tx(store, mode='readonly'){
  return db.transaction(store, mode).objectStore(store);
}
function dbGetAll(store){
  return new Promise((res,rej)=>{
    const r = tx(store).getAll();
    r.onsuccess = ()=>res(r.result||[]);
    r.onerror = ()=>rej(r.error);
  });
}
function dbGet(store, key){
  return new Promise((res,rej)=>{
    const r = tx(store).get(key);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function dbPut(store, obj){
  return new Promise((res,rej)=>{
    const r = tx(store,'readwrite').put(obj);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function dbDelete(store, key){
  return new Promise((res,rej)=>{
    const r = tx(store,'readwrite').delete(key);
    r.onsuccess = ()=>res();
    r.onerror = ()=>rej(r.error);
  });
}
function dbClear(store){
  return new Promise((res,rej)=>{
    const r = tx(store,'readwrite').clear();
    r.onsuccess = ()=>res();
    r.onerror = ()=>rej(r.error);
  });
}

/* ============================================================
   4. CONFIGURAÇÕES / META
   ============================================================ */
const CONFIG_DEFAULT = {
  nomeFantasia:'Casa da Elétrica',
  razaoSocial:'',
  cnpj:'',
  endereco:'',
  cep:'',
  telefone:'',
  whatsapp:'',
  pix:'',
  logo:'',
  rodapePadrao:'Obrigado pela preferência! Volte sempre à Casa da Elétrica.',
  validadePadrao:15,
  modeloPadrao:'moderno'
};

async function carregarConfig(){
  const rows = await dbGetAll('config');
  const cfg = {...CONFIG_DEFAULT};
  rows.forEach(r=>{ cfg[r.chave] = r.valor; });
  state.config = cfg;
}
async function salvarConfig(obj){
  const entries = Object.entries(obj);
  for(const [chave,valor] of entries){
    await dbPut('config',{chave,valor});
  }
  state.config = {...state.config, ...obj};
}
async function getMeta(chave){
  const r = await dbGet('meta', chave);
  return r ? r.valor : null;
}
async function setMeta(chave, valor){
  await dbPut('meta', {chave, valor});
}

/* ============================================================
   5. NUMERAÇÃO SEQUENCIAL
   ============================================================ */
async function proximoNumeroOrcamento(){
  let seq = await getMeta('seqOrcamento');
  if(!seq) seq = 0;
  seq += 1;
  await setMeta('seqOrcamento', seq);
  return seq;
}
function numeroFormatado(n){
  return String(n).padStart(4,'0');
}

/* ============================================================
   6. CARREGAR DADOS PARA O ESTADO
   ============================================================ */
async function carregarTudo(){
  state.produtos = await dbGetAll('produtos');
  state.clientes = await dbGetAll('clientes');
  state.orcamentos = await dbGetAll('orcamentos');
  await carregarConfig();
}

/* ============================================================
   7. CLIENTE PADRÃO
   ============================================================ */
async function garantirClientePadrao(){
  const clientes = await dbGetAll('clientes');
  const existe = clientes.find(c => c.padrao === true);
  if(!existe){
    const cf = {
      id: uid('cli'),
      nome: 'CONSUMIDOR FINAL',
      telefone:'', whatsapp:'', cpfCnpj:'', endereco:'', observacoes:'',
      padrao: true,
      criadoEm: new Date().toISOString()
    };
    await dbPut('clientes', cf);
  }
}

/* ============================================================
   8. ROTEAMENTO
   ============================================================ */
const ROUTES = {
  painel: renderPainel,
  novo: renderNovoOrcamento,
  produtos: renderProdutos,
  clientes: renderClientes,
  historico: renderHistorico,
  relatorios: renderRelatorios,
  config: renderConfig
};
const ROUTE_TITLES = {
  painel:'Painel', novo:'Novo Orçamento', produtos:'Produtos',
  clientes:'Clientes', historico:'Histórico de Orçamentos',
  relatorios:'Relatórios', config:'Configurações'
};

function navegar(route){
  if(!ROUTES[route]) route = 'painel';
  state.route = route;
  document.querySelectorAll('#desktopNav a, #mobileNav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });
  document.getElementById('topbarTitle').textContent = ROUTE_TITLES[route] || '';
  document.getElementById('sidebar').classList.remove('open');
  document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('show'));
  if(ROUTES[route]) ROUTES[route]();
}

/* ============================================================
   9. NAVEGAÇÃO / EVENTOS
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-route]');
  if(el){
    e.preventDefault();
    navegar(el.dataset.route);
  }
});
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace('#','');
  if(h) navegar(h);
});

/* ============================================================
   10. MODAL
   ============================================================ */
function openModal(title, bodyHtml, buttons=[]){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'btn-primary');
    btn.textContent = b.label;
    btn.onclick = b.action;
    footer.appendChild(btn);
  });
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ============================================================
   11. TELA: PAINEL
   ============================================================ */
async function renderPainel(){
  const orc = state.orcamentos;
  const total = orc.length;
  const abertos = orc.filter(o=>o.situacao==='Aberto').length;
  const enviados = orc.filter(o=>o.situacao==='Enviado').length;
  const aprovados = orc.filter(o=>o.situacao==='Aprovado').length;
  const recusados = orc.filter(o=>o.situacao==='Recusado').length;
  const somaTotal = orc.reduce((s,o)=>s + (Number(o.total)||0), 0);
  const ultimos = [...orc].sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||'')).slice(0,5);

  // verificar orçamentos vencidos
  const hoje = todayISO();
  for(const o of orc){
    if(o.situacao === 'Aberto' && o.validade && o.validade < hoje){
      // não alterar automaticamente; exibir como vencido
    }
  }

  const ultimoBackup = await getMeta('ultimoBackup');
  const diasSemBackup = ultimoBackup ? Math.floor((Date.now() - new Date(ultimoBackup).getTime())/86400000) : null;
  let avisoBackup = '';
  if(!ultimoBackup){
    avisoBackup = `<div class="card" style="border-left:4px solid var(--aviso);background:#fffbeb;">
      <div class="flex-between"><span>⚠️ <b>Nenhum backup realizado ainda.</b> Proteja seus dados!</span>
      <button class="btn btn-amarelo btn-sm" data-route="config">Fazer backup</button></div></div>`;
  } else if(diasSemBackup >= 15){
    avisoBackup = `<div class="card" style="border-left:4px solid var(--aviso);background:#fffbeb;">
      <div class="flex-between"><span>⚠️ Último backup há <b>${diasSemBackup} dias</b>. Recomendado fazer novo backup.</span>
      <button class="btn btn-amarelo btn-sm" data-route="config">Fazer backup</button></div></div>`;
  }

  document.getElementById('content').innerHTML = `
    ${avisoBackup}
    <div class="page-title">🏠 Painel<span class="sub">Visão geral do sistema</span></div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total de Orçamentos</div><div class="stat-value">${total}</div></div>
      <div class="stat-card amarelo"><div class="stat-label">Em Aberto</div><div class="stat-value">${abertos}</div></div>
      <div class="stat-card"><div class="stat-label">Enviados</div><div class="stat-value">${enviados}</div></div>
      <div class="stat-card verde"><div class="stat-label">Aprovados</div><div class="stat-value">${aprovados}</div></div>
      <div class="stat-card vermelho"><div class="stat-label">Recusados</div><div class="stat-value">${recusados}</div></div>
      <div class="stat-card amarelo"><div class="stat-label">Valor Total Orçado</div><div class="stat-value" style="font-size:20px;">${fmtMoney(somaTotal)}</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>⚡ Ações Rápidas</h2>
      </div>
      <div class="flex gap-10" style="flex-wrap:wrap;">
        <button class="btn btn-primary" data-route="novo">➕ Novo Orçamento</button>
        <button class="btn btn-outline" data-route="produtos">📦 Produtos (${state.produtos.length})</button>
        <button class="btn btn-outline" data-route="clientes">👥 Clientes (${state.clientes.length})</button>
        <button class="btn btn-outline" data-route="historico">📋 Histórico</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>🕒 Últimos Orçamentos</h2>
        <button class="btn btn-ghost btn-sm" data-route="historico">Ver todos</button>
      </div>
      ${ultimos.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th class="text-right">Total</th><th>Situação</th><th></th></tr></thead>
          <tbody>
            ${ultimos.map(o=>`
              <tr>
                <td><b>#${numeroFormatado(o.numero)}</b></td>
                <td>${fmtDate(o.data)}</td>
                <td>${escapeHtml(o.clienteNome||'—')}</td>
                <td class="text-right"><b>${fmtMoney(o.total)}</b></td>
                <td><span class="badge ${o.situacao.toLowerCase()}">${o.situacao}</span></td>
                <td class="actions-cell">
                  <button class="icon-btn view" onclick="visualizarOrcamento('${o.id}')" title="Visualizar">👁️</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty-state"><div class="empty-ico">📄</div><p>Nenhum orçamento cadastrado ainda.</p><button class="btn btn-primary" data-route="novo">Criar primeiro orçamento</button></div>`}
    </div>
  `;
}

/* ============================================================
   12. TELA: PRODUTOS
   ============================================================ */
async function renderProdutos(){
  const categorias = [...new Set(state.produtos.map(p=>p.categoria).filter(Boolean))].sort();
  document.getElementById('content').innerHTML = `
    <div class="page-title">📦 Produtos<span class="sub">Catálogo de produtos e preços</span></div>
    <div class="card">
      <div class="card-header">
        <h2>Lista de Produtos</h2>
        <button class="btn btn-primary" onclick="abrirFormProduto()">➕ Novo Produto</button>
      </div>
      <div class="search-bar">
        <div class="search-input">
          <span class="search-ico">🔍</span>
          <input type="text" id="buscaProduto" class="form-control" placeholder="Buscar por nome ou código...">
        </div>
        <select id="filtroCategoria" class="form-control" style="max-width:200px;">
          <option value="">Todas as categorias</option>
          ${categorias.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
      <div id="listaProdutos"></div>
    </div>
  `;
  document.getElementById('buscaProduto').addEventListener('input', renderListaProdutos);
  document.getElementById('filtroCategoria').addEventListener('change', renderListaProdutos);
  renderListaProdutos();
}

function renderListaProdutos(){
  const q = (document.getElementById('buscaProduto').value||'').toLowerCase().trim();
  const cat = document.getElementById('filtroCategoria').value;
  let lista = state.produtos.slice().sort((a,b)=> (a.nome||'').localeCompare(b.nome||''));
  if(q) lista = lista.filter(p=> (p.nome||'').toLowerCase().includes(q) || (p.codigo||'').toLowerCase().includes(q));
  if(cat) lista = lista.filter(p=> p.categoria === cat);

  const el = document.getElementById('listaProdutos');
  if(!lista.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-ico">📦</div><p>Nenhum produto encontrado.</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Un.</th><th class="text-right">Preço</th><th></th></tr></thead>
        <tbody>
          ${lista.map(p=>`
            <tr>
              <td>${escapeHtml(p.codigo||'—')}</td>
              <td><b>${escapeHtml(p.nome)}</b></td>
              <td>${escapeHtml(p.categoria||'—')}</td>
              <td>${escapeHtml(p.unidade||'UN')}</td>
              <td class="text-right"><b>${fmtMoney(p.preco)}</b></td>
              <td class="actions-cell">
                <button class="icon-btn edit" onclick="abrirFormProduto('${p.id}')" title="Editar">✏️</button>
                <button class="icon-btn del" onclick="excluirProduto('${p.id}')" title="Excluir">🗑️</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="muted mt-10">${lista.length} produto(s) exibido(s).</div>
  `;
}

function abrirFormProduto(id=null){
  const p = id ? state.produtos.find(x=>x.id===id) : null;
  openModal(p ? 'Editar Produto' : 'Novo Produto', `
    <div class="form-group">
      <label>Nome do produto <span class="req">*</span></label>
      <input type="text" id="pNome" class="form-control" value="${p?escapeHtml(p.nome):''}" placeholder="Ex: Cabo flexível 2,5mm">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Código / Referência</label>
        <input type="text" id="pCodigo" class="form-control" value="${p?escapeHtml(p.codigo||''):''}" placeholder="Ex: CB-25">
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" id="pCategoria" class="form-control" value="${p?escapeHtml(p.categoria||''):''}" placeholder="Ex: Cabos e Fios">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Unidade</label>
        <select id="pUnidade" class="form-control">
          ${UNIDADES.map(u=>`<option value="${u}" ${p&&p.unidade===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Preço unitário (R$) <span class="req">*</span></label>
        <input type="number" id="pPreco" class="form-control" step="0.01" min="0" value="${p?Number(p.preco).toFixed(2):''}" placeholder="0,00">
      </div>
    </div>
  `, [
    {label:'Cancelar', cls:'btn-outline', action:closeModal},
    {label:p?'Salvar':'Cadastrar', cls:'btn-primary', action: async ()=>{
      const nome = document.getElementById('pNome').value.trim();

function editarItem(idx, campo, valor){
  if(!state.produtosTemp[idx]) return;
  state.produtosTemp[idx][campo] = valor;
  if(campo==='quantidade' || campo==='preco'){
    renderProdutosOrcamento();
  }
  atualizarTotaisOrc();
}

function removerItemOrc(idx){
  state.produtosTemp.splice(idx,1);
  renderProdutosOrcamento();
  atualizarTotaisOrc();
}

function adicionarProdutoSelecionado(){
  const id = document.getElementById('addProdutoId').value;
  if(!id){ toast('Selecione um produto.','error'); return; }
  const p = state.produtos.find(x=>x.id===id);
  if(!p){ toast('Produto inválido.','error'); return; }
  const qtd = parseFloat(document.getElementById('addQtd').value);
  const preco = parseFloat(document.getElementById('addPreco').value);
  const obs = document.getElementById('addObs').value.trim();
  if(isNaN(qtd)||qtd<=0){ toast('Quantidade inválida.','error'); return; }
  if(isNaN(preco)||preco<0){ toast('Preço inválido.','error'); return; }

  // REGRA: agrupar produtos repetidos por produtoId, somando quantidade
  const existente = state.produtosTemp.find(it=> it.produtoId === id);
  if(existente){
    existente.quantidade = Number(existente.quantidade) + qtd;
    // preço da primeira inclusão preservado
    if(obs){
      existente.observacao = (existente.observacao ? existente.observacao + '\n' : '') + obs;
    }
    toast('Quantidade somada à linha existente (preço original preservado).','info');
  } else {
    state.produtosTemp.push({
      produtoId: id,
      nome: p.nome,
      unidade: p.unidade || 'UN',
      preco,
      quantidade: qtd,
      observacao: obs
    });
    toast('Produto adicionado.','success');
  }
  closeModal();
  renderProdutosOrcamento();
  atualizarTotaisOrc();
}

/* ===== Cálculos ===== */
function atualizarTotaisOrc(){
  const subtotal = state.produtosTemp.reduce((s,it)=> s + (Number(it.quantidade)*Number(it.preco)), 0);
  let descValor = parseFloat(document.getElementById('orcDescontoValor')?.value) || 0;
  let descPct = parseFloat(document.getElementById('orcDescontoPct')?.value) || 0;
  let frete = parseFloat(document.getElementById('orcFrete')?.value) || 0;
  if(descValor<0) descValor=0;
  if(descPct<0) descPct=0;
  if(descPct>100) descPct=100;
  if(frete<0) frete=0;

  const descPctValor = subtotal * (descPct/100);
  let descontoTotal = descValor + descPctValor;
  if(descontoTotal > subtotal) descontoTotal = subtotal;
  const total = Math.max(0, subtotal - descontoTotal + frete);

  const el = document.getElementById('orcTotais');
  if(el) el.innerHTML = `
    <div class="linha"><span>Subtotal</span><span>${fmtMoney(subtotal)}</span></div>
    ${descPct>0?`<div class="linha"><span>Desconto (${fmtNum(descPct)}%)</span><span>- ${fmtMoney(descPctValor)}</span></div>`:''}
    ${descValor>0?`<div class="linha"><span>Desconto fixo</span><span>- ${fmtMoney(descValor)}</span></div>`:''}
    ${frete>0?`<div class="linha"><span>Frete</span><span>+ ${fmtMoney(frete)}</span></div>`:''}
    <div class="linha total"><span>Total</span><span>${fmtMoney(total)}</span></div>
  `;
}

/* ===== Salvar orçamento ===== */
async function salvarOrcamento(){
  const clienteId = document.getElementById('orcCliente').value;
  const cliente = state.clientes.find(c=>c.id===clienteId);
  if(!cliente){ toast('Selecione um cliente.','error'); return; }
  if(!state.produtosTemp.length){ toast('Adicione ao menos um produto.','error'); return; }

  const data = document.getElementById('orcData').value || todayISO();
  const validade = document.getElementById('orcValidade').value || '';
  const condicaoPagamento = document.getElementById('orcCondPagto').value;
  const situacao = document.getElementById('orcSituacao').value;
  const descontoValor = parseFloat(document.getElementById('orcDescontoValor').value)||0;
  const descontoPct = parseFloat(document.getElementById('orcDescontoPct').value)||0;
  const frete = parseFloat(document.getElementById('orcFrete').value)||0;
  const observacoes = document.getElementById('orcObservacoes').value.trim();
  const rodapePersonalizado = document.getElementById('orcRodapeCustom').value.trim();
  const modelo = document.getElementById('orcModelo').value;

  // recalcular
  const subtotal = state.produtosTemp.reduce((s,it)=> s + (Number(it.quantidade)*Number(it.preco)), 0);
  let descPctValor = subtotal * (Math.min(100,Math.max(0,descontoPct))/100);
  let descTotal = Math.min(subtotal, Math.max(0,descontoValor) + descPctValor);
  const total = Math.max(0, subtotal - descTotal + Math.max(0,frete));

  const editando = state.orcamentoEmEdicao;
  let numero = editando ? editando.numero : await proximoNumeroOrcamento();

  const obj = {
    id: editando ? editando.id : uid('orc'),
    numero,
    data,
    validade,
    clienteId,
    clienteNome: cliente.nome,
    condicaoPagamento,
    situacao,
    itens: state.produtosTemp.map(it=>({
      produtoId: it.produtoId,
      nome: it.nome,
      unidade: it.unidade,
      preco: Number(it.preco),
      quantidade: Number(it.quantidade),
      observacao: it.observacao || ''
    })),
    subtotal,
    descontoValor: Math.max(0,descontoValor),
    descontoPct: Math.min(100,Math.max(0,descontoPct)),
    frete: Math.max(0,frete),
    total,
    observacoes,
    rodapePersonalizado,
    modelo,
    criadoEm: editando ? editando.criadoEm : new Date().toISOString(),
    atualizadoEm: new Date().toISOString()
  };

  await dbPut('orcamentos', obj);
  state.orcamentos = await dbGetAll('orcamentos');
  state.orcamentoEmEdicao = null;
  state.produtosTemp = [];
  toast(editando ? 'Orçamento atualizado.' : 'Orçamento salvo com sucesso.','success');
  navegar('historico');
}

async function gerarPNG(orc){
  const html = gerarHTMLDocumento(orc);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;padding:0;width:820px;';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  const el = wrap.querySelector('#docToRender');
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const dataUrl = canvas.toDataURL('image/png');
    const nome = `orcamento_${numeroFormatado(orc.numero)}_${orc.clienteNome.replace(/[^a-zA-Z0-9]/g,'_').slice(0,20)}.png`;
    baixarArquivo(dataUrl, nome);
    // oferta de compartilhar
    if(navigator.share && navigator.canShare){
      try{
        const resp = await new Promise(r=>{
          openModal('Imagem Gerada', '<p>Deseja compartilhar a imagem?</p>', [
            {label:'Só baixar', cls:'btn-outline', action:()=>{closeModal();r(false);}},
            {label:'Compartilhar', cls:'btn-primary', action:()=>{closeModal();r(true);}}
          ]);
        });
        if(resp){
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], nome, {type:'image/png'});
          if(navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:'Orçamento Casa da Elétrica'});
          }
        }
      }catch(_){}
    }
    toast('Imagem PNG gerada.','success');
  }catch(err){
    console.error(err); toast('Falha ao gerar imagem.','error');
  }finally{
    wrap.remove();
  }
}

function baixarArquivo(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>a.remove(), 100);
}

/* ============================================================
   17. GERAR PDF (A4, paginação automática)
   ============================================================ */
async function gerarPDF(orc){
  const { jsPDF } = window.jspdf;
  const html = gerarHTMLDocumento(orc);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;width:820px;';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  const el = wrap.querySelector('#docToRender');
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth();  // 210
    const pageH = pdf.internal.pageSize.getHeight(); // 297
    const margin = 8;
    const imgW = pageW - margin*2;
    const imgH = (canvas.height * imgW) / canvas.width;
    let heightLeft = imgH;
    let position = margin;
    pdf.addImage(imgData, 'JPEG', margin, position, imgW, imgH);
    heightLeft -= (pageH - margin*2);

    while(heightLeft > 0){
      pdf.addPage();
      // desloca a imagem para cima pela altura já renderizada
      position = margin - (imgH - heightLeft);
      pdf.addImage(imgData, 'JPEG', margin, position, imgW, imgH);
      heightLeft -= (pageH - margin*2);
    }
    const nome = `orcamento_${numeroFormatado(orc.numero)}.pdf`;
    pdf.save(nome);
    toast('PDF gerado.','success');
  }catch(err){
    console.error(err); toast('Falha ao gerar PDF.','error');
  }finally{
    wrap.remove();
  }
}

  const ok = await confirmar(`Duplicar o orçamento #${numeroFormatado(o.numero)}?`,'Duplicar');
  if(!ok) return;
  const novoNum = await proximoNumeroOrcamento();
  const novo = {
    ...o,
    id: uid('orc'),
    numero: novoNum,
    data: todayISO(),
    validade: addDaysISO(todayISO(), state.config.validadePadrao||15),
    situacao: 'Aberto',
    criadoEm: new Date().toISOString(),
    atualizadoEm: new Date().toISOString()
  };
  await dbPut('orcamentos', novo);
  state.orcamentos = await dbGetAll('orcamentos');
  toast('Orçamento duplicado (#'+numeroFormatado(novoNum)+').','success');
  renderHistorico();
}

async function excluirOrcamento(id){
  const o = state.orcamentos.find(x=>x.id===id);
  if(!o) return;
  const ok = await confirmar(`Excluir o orçamento #${numeroFormatado(o.numero)}? A numeração não será reutilizada.`,'Excluir');
  if(!ok) return;
  await dbDelete('orcamentos', id);
  state.orcamentos = await dbGetAll('orcamentos');
  toast('Orçamento excluído.','success');
  renderHistorico();
}

function renderRelatoriosDados(){
  const ini = document.getElementById('rIni').value;
  const fim = document.getElementById('rFim').value;
  let orcs = state.orcamentos.slice();
  if(ini) orcs = orcs.filter(o=> o.data >= ini);
  if(fim) orcs = orcs.filter(o=> o.data <= fim);

  const total = orcs.length;
  const somaTotal = orcs.reduce((s,o)=>s+(Number(o.total)||0),0);
  const aprovados = orcs.filter(o=>o.situacao==='Aprovado');
  const recusados = orcs.filter(o=>o.situacao==='Recusado');
  const somaAprov = aprovados.reduce((s,o)=>s+(Number(o.total)||0),0);

  // Clientes com mais orçamentos
  const porCliente = {};
  orcs.forEach(o=>{
    const k = o.clienteNome || '—';
    porCliente[k] = porCliente[k]||{qtd:0,total:0};
    porCliente[k].qtd++;
    porCliente[k].total += Number(o.total)||0;
  });
  const topClientes = Object.entries(porCliente).sort((a,b)=>b[1].qtd-a[1].qtd).slice(0,8);

  // Produtos mais utilizados
  const porProduto = {};
  orcs.forEach(o=>{
    (o.itens||[]).forEach(it=>{
      const k = it.nome;
      porProduto[k] = porProduto[k]||{qtd:0,total:0};
      porProduto[k].qtd += Number(it.quantidade)||0;
      porProduto[k].total += (Number(it.quantidade)||0)*(Number(it.preco)||0);
    });
  });
  const topProdutos = Object.entries(porProduto).sort((a,b)=>b[1].qtd-a[1].qtd).slice(0,10);

  document.getElementById('rConteudo').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Orçamentos no período</div><div class="stat-value">${total}</div></div>
      <div class="stat-card amarelo"><div class="stat-label">Valor total orçado</div><div class="stat-value" style="font-size:19px;">${fmtMoney(somaTotal)}</div></div>
      <div class="stat-card verde"><div class="stat-label">Aprovados</div><div class="stat-value">${aprovados.length}</div><div class="stat-sub">${fmtMoney(somaAprov)}</div></div>
      <div class="stat-card vermelho"><div class="stat-label">Recusados</div><div class="stat-value">${recusados.length}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><h2>👥 Clientes com mais orçamentos</h2></div>
      ${topClientes.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Cliente</th><th class="text-right">Qtd.</th><th class="text-right">Valor total</th></tr></thead>
        <tbody>${topClientes.map(([nome,d])=>`<tr><td><b>${escapeHtml(nome)}</b></td><td class="text-right">${d.qtd}</td><td class="text-right">${fmtMoney(d.total)}</td></tr>`).join('')}</tbody>
      </table></div>` : '<p class="muted">Sem dados no período.</p>'}
    </div>

    <div class="card">
      <div class="card-header"><h2>📦 Produtos mais utilizados</h2></div>
      ${topProdutos.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Produto</th><th class="text-right">Qtd. total</th><th class="text-right">Valor total</th></tr></thead>
        <tbody>${topProdutos.map(([nome,d])=>`<tr><td><b>${escapeHtml(nome)}</b></td><td class="text-right">${fmtNum(d.qtd)}</td><td class="text-right">${fmtMoney(d.total)}</td></tr>`).join('')}</tbody>
      </table></div>` : '<p class="muted">Sem dados no período.</p>'}
    </div>
  `;
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   21. BACKUP / RESTAURAÇÃO
   ============================================================ */
async function coletarDadosBackup(){
  const produtos = await dbGetAll('produtos');
  const clientes = await dbGetAll('clientes');
  const orcamentos = await dbGetAll('orcamentos');
  const cfgRows = await dbGetAll('config');
  const cfg = {};
  cfgRows.forEach(r=>{ cfg[r.chave]=r.valor; });
  const seqOrcamento = await getMeta('seqOrcamento');
  return {
    versao: BACKUP_VERSION,
    geradoEm: new Date().toISOString(),
    produtos, clientes, orcamentos, config: cfg, seqOrcamento
  };
}
async function fazerBackup(){
  try{
    const dados = await coletarDadosBackup();
    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const nome = `backup_casa_eletrica_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    baixarArquivo(url, nome);
    await setMeta('ultimoBackup', new Date().toISOString());
    toast('Backup gerado.','success');
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    if(state.route==='config') renderConfig();
  }catch(e){
    console.error(e); toast('Falha ao gerar backup.','error');
  }
}

async function restaurarBackup(input){
  const file = input.files[0];
  if(!file) return;
  try{
    const texto = await file.text();
    let dados;
    try{ dados = JSON.parse(texto); } catch(_){ toast('Arquivo JSON inválido.','error'); input.value=''; return; }
    if(!dados.versao || !Array.isArray(dados.produtos) || !Array.isArray(dados.clientes) || !Array.isArray(dados.orcamentos) || !dados.config){
      toast('Arquivo de backup incompatível.','error'); input.value=''; return;
    }
    // confirmação com info
    const info = `
      <p><b>Data do backup:</b> ${fmtDateTime(dados.geradoEm)}</p>
      <p><b>Versão:</b> ${dados.versao}</p>
      <ul style="margin:10px 0 0 20px;">
        <li>Produtos: <b>${dados.produtos.length}</b></li>
        <li>Clientes: <b>${dados.clientes.length}</b></li>
        <li>Orçamentos: <b>${dados.orcamentos.length}</b></li>
      </ul>
      <p class="muted small mt-10">⚠️ Os dados atuais serão substituídos. Uma cópia de segurança será baixada automaticamente antes.</p>
    `;
    openModal('Confirmar Restauração', info, [
      {label:'Cancelar', cls:'btn-outline', action:()=>{closeModal(); input.value='';}},
      {label:'Fazer backup atual + Restaurar', cls:'btn-danger', action: async ()=>{
        closeModal();
        // backup de segurança automático
        await fazerBackup();
        // limpar e restaurar
        await dbClear('produtos'); await dbClear('clientes'); await dbClear('orcamentos');
        await dbClear('config'); await dbClear('meta');
        for(const p of dados.produtos) await dbPut('produtos', p);
        for(const c of dados.clientes) await dbPut('clientes', c);
        for(const o of dados.orcamentos) await dbPut('orcamentos', o);
        for(const [chave,valor] of Object.entries(dados.config)) await dbPut('config', {chave, valor});
        await setMeta('seqOrcamento', dados.seqOrcamento || 0);
        await setMeta('ultimoBackup', new Date().toISOString());
        await carregarTudo();
        input.value='';
        toast('Backup restaurado com sucesso.','success');
        navegar('painel');
      }}
    ]);
  }catch(e){
    console.error(e); toast('Falha ao restaurar backup.','error'); input.value='';
  }
}

async function limparTodosDados(){
  const ok = await confirmar('Isso apagará TODOS os dados (produtos, clientes, orçamentos e configurações) e não poderá ser desfeito. Continuar?','Limpar Tudo');
  if(!ok) return;
  const ok2 = await confirmar('Tem certeza ABSOLUTA? Faça backup antes se necessário.','Confirmação Final');
  if(!ok2) return;
  await fazerBackup();
  for(const s of STORES) await dbClear(s);
  await carregarTudo();
  await garantirClientePadrao();
  await carregarTudo();
  toast('Todos os dados foram apagados.','success');
  navegar('painel');
}
